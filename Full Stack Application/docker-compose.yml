services:
  backend:
    build:
      context: ./backend
    container_name: django_backend
    environment:
      DEBUG: "False"
      API_URL: "http://backend:8000"
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: "/api"
    container_name: react_frontend
    ports:
      - "80:8080"
    depends_on:
      - backend
